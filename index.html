<!DOCTYPE html>
<html lang="es">
<head>

<title>Mis Finanzas</title>

<style>
:root{
  --pist:#B39F02;--wine:#690507;--cocoa:#4C1D03;--sea:#A9C4BF;
  --cream:#FBF8EE;--paper:#FFFDF8;--ink:#2B1608;--muted:#7D6B5B;--line:#EDE5D4;
  --sea-soft:#E5EEEB;--pist-soft:#F4F0D2;--wine-soft:#F7E4E2;--cocoa-soft:#EFE5DC;
  --ok:#6F7F06;--r:20px;--r-sm:14px;
  --shadow:0 1px 2px rgba(76,29,3,.05),0 10px 28px rgba(76,29,3,.07);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.brand,.big,.num{font-family:'Figtree',system-ui,sans-serif;letter-spacing:-.01em}
h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--wine)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--wine)}
.hidden{display:none!important}
/* layout */
#app{display:flex;min-height:100vh}
#side{display:none}
#main{flex:1;min-width:0;padding:calc(14px + var(--safe-t)) 16px calc(110px + var(--safe-b));max-width:1180px;margin:0 auto;width:100%}
#top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#top h1{flex:1;font-size:24px}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;font-size:18px;position:relative}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:9px;background:var(--wine);border:2px solid var(--paper)}
#sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
#sync i{width:8px;height:8px;border-radius:8px;background:var(--sea);display:inline-block}
#sync.err i{background:var(--wine)}#sync.saving i{background:var(--pist)}
#bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));z-index:30}
#bottom a{flex:1;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:11px;gap:1px;padding:4px 0;border-radius:12px;cursor:pointer}
#bottom a span{font-size:20px;line-height:1.1}
#bottom a.on{color:var(--cocoa);font-weight:700}
#fab{position:fixed;right:16px;bottom:calc(76px + var(--safe-b));z-index:31;background:var(--wine);color:#fff;border:none;border-radius:999px;padding:14px 20px;font-family:'Figtree',system-ui,sans-serif;font-weight:700;font-size:15px;box-shadow:0 10px 26px rgba(105,5,7,.35);cursor:pointer;display:flex;gap:8px;align-items:center}
#fab:active{transform:scale(.97)}
@media(min-width:960px){
  #side{display:flex;flex-direction:column;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--cocoa);color:#F7EFE6}
  #side .brand{font-size:21px;font-weight:800;padding:4px 12px 2px;color:#fff}
  #side .brand b{color:var(--pist)}
  #side .sub{font-size:12px;opacity:.65;padding:0 12px 18px}
  #side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;color:#F1E6DA;text-decoration:none;font-weight:500;cursor:pointer;margin-bottom:2px}
  #side a:hover{background:rgba(255,255,255,.07)}
  #side a.on{background:var(--pist);color:var(--cocoa);font-weight:700}
  #side .grow{flex:1}
  #bottom{display:none}
  #fab{bottom:28px;right:32px}
  #main{padding:28px 32px 60px}
}
/* cards */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
@media(min-width:720px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.md2{grid-template-columns:1fr 1fr}.md32{grid-template-columns:3fr 2fr}}
@media(max-width:719px){.g3,.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h2{display:flex;align-items:center;gap:8px}
.card h2 .act{margin-left:auto}
.section{margin-top:18px}
.hero{background:radial-gradient(120% 140% at 100% 0%,#7a2a06 0%,var(--cocoa) 45%,#2f1102 100%);color:#FBF3E8;border:none;padding:22px 20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(179,159,2,.45),transparent 70%)}
.hero .lbl{font-size:13px;opacity:.8;display:flex;gap:8px;align-items:center}
.hero .big{font-size:40px;font-weight:800;margin:4px 0 10px;color:#fff;line-height:1.05}
.hero .row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.stat .lbl{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat .val{font-family:'Figtree',system-ui,sans-serif;font-weight:800;font-size:21px;margin-top:2px}
.stat .hint{font-size:12px;color:var(--muted);margin-top:2px}
.stat.sea{background:var(--sea-soft);border-color:#d2e2dd}
.stat.pist{background:var(--pist-soft);border-color:#e7dfa8}
.stat.wine{background:var(--wine-soft);border-color:#efcfcc}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--cocoa-soft);color:var(--cocoa);white-space:nowrap}
.chip.urgente{background:var(--wine-soft);color:var(--wine)}
.chip.importante{background:var(--pist-soft);color:#6d6000}
.chip.aspiracional{background:var(--sea-soft);color:#3c6159}
.chip.ok{background:#EAF0D2;color:#4f5c03}
.chip.warn{background:#FBEFC9;color:#7a5a00}
.chip.danger{background:var(--wine-soft);color:var(--wine)}
/* list rows */
.list{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:default}
.rowi:last-child{border-bottom:none}
.rowi.click{cursor:pointer}.rowi.click:hover{background:rgba(76,29,3,.025)}
.emo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--cream);flex:none;border:1px solid var(--line)}
.rowi .main{flex:1;min-width:0}
.rowi .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .amt{font-family:'Figtree',system-ui,sans-serif;font-weight:700;text-align:right;white-space:nowrap}
.dayhdr{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px}
/* buttons */
.btn{border:none;border-radius:14px;padding:11px 16px;font-weight:700;font-family:'Figtree',system-ui,sans-serif;cursor:pointer;background:var(--cocoa);color:#fff;display:inline-flex;align-items:center;gap:7px;justify-content:center;font-size:14.5px}
.btn.wine{background:var(--wine)}.btn.pist{background:var(--pist);color:var(--cocoa)}.btn.sea{background:var(--sea);color:var(--cocoa)}
.btn.ghost{background:transparent;color:var(--cocoa);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--wine);font-weight:700;cursor:pointer;padding:0;font-size:13px}
/* forms */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:15px;outline:none}
.inp:focus{border-color:var(--pist);box-shadow:0 0 0 3px rgba(179,159,2,.18)}
.amount-inp{font-family:'Figtree',system-ui,sans-serif;font-size:38px;font-weight:800;border:none;background:transparent;width:100%;outline:none;padding:4px 0;color:var(--cocoa)}
.amount-wrap{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);margin-bottom:6px}
.amount-wrap .cur{font-family:'Figtree',system-ui,sans-serif;font-size:22px;font-weight:700;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.catbtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;text-align:center}
.catbtn b{font-size:22px;font-weight:400}
.catbtn.on{border-color:var(--wine);background:var(--wine-soft);color:var(--wine)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.selchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.selchip.on{background:var(--cocoa);border-color:var(--cocoa);color:#fff}
.seg{display:flex;background:var(--cocoa-soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;border-radius:11px;padding:9px 6px;font-weight:700;cursor:pointer;font-size:13px;color:var(--cocoa)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;margin:10px 0}
.toggle input{width:20px;height:20px;accent-color:var(--wine)}
/* progress */
.bar{height:10px;background:var(--cocoa-soft);border-radius:10px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--pist),#cdb81a)}
.bar.wine>i{background:linear-gradient(90deg,var(--wine),#9b1f1a)}
.bar.sea>i{background:linear-gradient(90deg,#7fa8a0,var(--sea))}
/* sheet */
#sheet-wrap{position:fixed;inset:0;background:rgba(43,22,8,.42);z-index:50;display:none;align-items:flex-end;justify-content:center}
#sheet-wrap.open{display:flex}
#sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + var(--safe-b));animation:up .22s ease}
@media(min-width:720px){#sheet-wrap{align-items:center}#sheet{border-radius:24px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-h h2{flex:1;margin:0}
/* lock */
#lock{position:fixed;inset:0;z-index:80;background:radial-gradient(130% 100% at 50% 0%,#6a2a08,var(--cocoa) 50%,#250d01);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock .brand{font-size:28px;font-weight:800}
#lock .brand b{color:var(--pist)}
.dots{display:flex;gap:14px;margin:22px 0}
.dots i{width:14px;height:14px;border-radius:14px;border:2px solid rgba(255,255,255,.6)}
.dots i.f{background:var(--pist);border-color:var(--pist)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{width:72px;height:72px;border-radius:72px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font-size:26px;font-family:'Figtree',system-ui,sans-serif;font-weight:600;cursor:pointer}
.pad button:active{background:rgba(255,255,255,.2)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#onb{max-width:440px;width:100%;text-align:left;background:var(--paper);color:var(--ink);border-radius:24px;padding:22px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + var(--safe-b));background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.banner{border-radius:16px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;border:1px solid}
.banner.info{background:var(--sea-soft);border-color:#cfe0db}
.banner.warn{background:#FBF2D6;border-color:#efe0ab}
.banner.danger{background:var(--wine-soft);border-color:#efcfcc}
.insight{display:flex;gap:12px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);margin-bottom:10px}
.insight .ic{font-size:22px}
.insight.warn{border-left:4px solid #d9b400}.insight.danger{border-left:4px solid var(--wine)}.insight.ok{border-left:4px solid var(--pist)}.insight.info{border-left:4px solid var(--sea)}
details.exp{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13.5px}
details.exp summary{cursor:pointer;font-weight:700;color:var(--cocoa)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}
.chartbox{position:relative;height:240px}
.chartbox.sm{height:200px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .e{font-size:34px}
.goal{display:flex;flex-direction:column;gap:8px}
.goal .gh{display:flex;align-items:center;gap:10px}
.goal .gh .emo{width:46px;height:46px;font-size:24px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.kv div span{display:block;color:var(--muted);font-size:11.5px}
.kv div b{font-family:'Figtree',system-ui,sans-serif}
.edu{background:var(--sea-soft);border-radius:16px;padding:12px 14px;font-size:13.5px}
.edu b{color:var(--cocoa)}
.blur .money{filter:blur(8px)}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navgrid a{display:flex;gap:10px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;text-decoration:none;color:var(--ink);font-weight:600;cursor:pointer}
.navgrid a span{font-size:22px}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{min-width:120px;text-align:center;font-family:'Figtree',system-ui,sans-serif}
</style>
</head>
<body>
<div id="app" class="hidden">
  <aside id="side"></aside>
  <main id="main">
    <header id="top">
      <h1 id="title">Inicio</h1>
      <div id="sync"><i></i><span>…</span></div>
      <button class="iconbtn" data-act="toggleHide" title="Ocultar montos">👁️</button>
      <button class="iconbtn" data-act="openAlerts" title="Alertas" id="bell">🔔</button>
      <button class="iconbtn" data-act="lockNow" title="Bloquear">🔒</button>
    </header>
    <div id="view"></div>
  </main>
  <nav id="bottom"></nav>
  <button id="fab" data-act="quickAdd"><span style="font-size:20px">＋</span> Nuevo gasto</button>
</div>
<div id="sheet-wrap"><div id="sheet"></div></div>
<div id="lock"><div class="brand">Mis <b>Finanzas</b></div><p class="muted" style="color:#e9d9c9">Cargando tu información…</p></div>
<div id="toast"></div>

<script>
"use strict";
/* =========================================================
   UTILIDADES
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoD(new Date());
const parseISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoD(d)};
const ym=s=>String(s).slice(0,7);
const addMonths=(m,n)=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dim=(y,m)=>new Date(y,m,0).getDate();
const monthEnd=m=>{const [y,mo]=m.split('-').map(Number);return m+'-'+pad(dim(y,mo))};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fmtDate=s=>{if(!s)return '';const d=parseISO(s);return d.getDate()+' '+MES[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const fmtYM=s=>{const [y,m]=s.split('-');return MESL[+m-1]+' '+y};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(/,/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const SYM={PEN:'S/',USD:'US$'};
const CLOUD_URL='https://claude.ai/artifact/TVxdCErLHxzCZmarMhnLJ7';
function money(n,cur='PEN',dec){n=+n||0;const d=dec??(Math.abs(n)>=10000?0:2);return '<span class="money">'+(n<0?'−':'')+SYM[cur]+' '+Math.abs(n).toLocaleString('es-PE',{minimumFractionDigits:d,maximumFractionDigits:d})+'</span>'}
function moneyT(n,cur='PEN',dec){n=+n||0;const d=dec??(Math.abs(n)>=10000?0:2);return (n<0?'−':'')+SYM[cur]+' '+Math.abs(n).toLocaleString('es-PE',{minimumFractionDigits:d,maximumFractionDigits:d})}
const C=()=>S.config;
const toPEN=(n,cur)=>cur==='USD'?n*C().fx:n;
const fromPEN=(n,cur)=>cur==='USD'?n/C().fx:n;
const conv=(n,from,to)=>from===to?n:fromPEN(toPEN(n,from),to);
const monthsBetween=(fromISO,toISO)=>{const a=parseISO(fromISO),b=parseISO(toISO);return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+(b.getDate()-a.getDate())/30};
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms)}
const daysAgo=s=>Math.round((parseISO(today())-parseISO(s))/864e5);

/* =========================================================
   DATOS DE REFERENCIA (investigados el 15-nov-2026)
   Son estimaciones, no cotizaciones. Editables desde el planificador.
   ========================================================= */

/* =========================================================
   ALMACENAMIENTO PERSISTENTE (base de datos privada por usuaria)
   ========================================================= */
const Store={
  mode:'loading',db:null,uid:null,user:null,timers:{},writing:{},dirty:new Set(),unsub:null,me:null,
  withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))])},
  async init(){
    let db=null,user=null;
    this.inClaude=typeof claude!=='undefined'&&!!claude&&!!claude.use;
    if(this.inClaude){
      try{[db,user]=await Promise.all([this.withTimeout(claude.use('db'),11000),this.withTimeout(claude.use('user'),11000)])}catch(e){}
    }
    this.user=user;
    if(user){try{this.uid=await user.id()}catch(e){} try{this.me=await user.me()}catch(e){}}
    if(db&&this.uid){
      this.db=db;this.mode='db';
      try{
        const snap=await this.withTimeout(db.collection(this.base()).get(),15000);
        if(!snap) throw new Error('timeout');
        snap.docs.forEach(d=>this.ingest(d.id,d.data()));
        this.listen();
      }catch(e){console.warn('db',e);this.mode='error';return}
    }else if(this.inClaude){this.mode='error';return}
    else{this.mode='local';this.loadLocal()}
    setSync('ok');
  },
  base(){return 'data/users/'+this.uid},
  ingest(id,data){
    if(!data)return;
    if(id==='config')S.config=JSON.parse(JSON.stringify(data));
    else if(id==='pay')S.pay={items:{...(data.items||{})}};
    else if(id==='inv')S.inv=Object.assign({trades:[],prices:{},priceHist:{},watch:[]},JSON.parse(JSON.stringify(data)));
    else if(id.startsWith('mov-'))S.movs[id]={items:JSON.parse(JSON.stringify(data.items||[]))};
  },
  listen(){
    try{
      this.unsub=this.db.collection(this.base()).onSnapshot(snap=>{
        let changed=false;
        snap.docChanges().forEach(ch=>{
          const id=ch.doc.id;
          if(this.dirty.has(id)||this.writing[id]||snap.metadata.hasPendingWrites)return;
          if(ch.type==='removed'){if(id.startsWith('mov-')){delete S.movs[id];changed=true}return}
          const cur=JSON.stringify(this.bodyFor(id)||null),inc=JSON.stringify(ch.doc.data()||null);
          if(cur!==inc){this.ingest(id,ch.doc.data());changed=true}
        });
        if(changed&&UI.unlocked&&!$('#sheet-wrap').classList.contains('open'))render();
      },e=>{console.warn('snap',e)});
    }catch(e){}
  },
  loadLocal(){
    try{
      for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('fin:'))this.ingest(k.slice(4),JSON.parse(localStorage.getItem(k)))}
    }catch(e){}
  },
  bodyFor(k){if(k==='config')return S.config;if(k==='pay')return S.pay;if(k==='inv')return S.inv;if(k.startsWith('mov-'))return S.movs[k]||{items:[]};return null},
  save(...keys){
    keys.forEach(k=>{this.dirty.add(k);clearTimeout(this.timers[k]);this.timers[k]=setTimeout(()=>this.flush(k),500)});
    setSync('saving');
  },
  async flush(k){
    if(this.writing[k]){this.timers[k]=setTimeout(()=>this.flush(k),400);return}
    const body=JSON.parse(JSON.stringify(this.bodyFor(k)||{}));
    this.writing[k]=true;this.dirty.delete(k);
    try{
      if(this.mode==='db'){
        const ref=this.db.doc(this.base()+'/'+k);
        if(k.startsWith('mov-')&&(!body.items||!body.items.length))await ref.delete();else await ref.set(body);
      }else{
        try{localStorage.setItem('fin:'+k,JSON.stringify(body))}catch(e){}
      }
      if(!this.dirty.size)setSync('ok');
    }catch(e){
      console.warn('write',k,e);
      if(e&&e.code==='unavailable'){this.dirty.add(k);this.timers[k]=setTimeout(()=>this.flush(k),1500+Math.random()*1500)}
      else if(e&&e.code==='quota_exceeded')setSync('err','La base de datos está llena: exporta y limpia movimientos antiguos');
      else setSync('err','No se pudo guardar ('+(e&&e.code||'error')+')');
    }finally{this.writing[k]=false}
  },
  async wipe(){
    const keys=['config','pay','inv',...Object.keys(S.movs)];
    for(const k of keys){
      try{if(this.mode==='db')await this.db.doc(this.base()+'/'+k).delete();else localStorage.removeItem('fin:'+k)}catch(e){}
    }
  }
};
function setSync(state,msg){
  const el=$('#sync');if(!el)return;
  el.className=state==='err'?'err':state==='saving'?'saving':'';
  const txt=state==='err'?(msg||'Error al guardar'):state==='saving'?'Guardando…':(Store.mode==='db'?'Guardado en la nube':'Guardado en este navegador');
  el.querySelector('span').textContent=window.innerWidth<520&&state==='ok'?'':txt;
  el.title=txt;
  if(state==='err')toast(txt,4000);
}

/* =========================================================
   MOVIMIENTOS
   ========================================================= */
function allMovs(){return Object.keys(S.movs).sort().flatMap(k=>S.movs[k].items||[])}
function findMov(id){for(const k in S.movs){const i=(S.movs[k].items||[]).findIndex(x=>x.id===id);if(i>=0)return [k,i]}return null}
function getMov(id){const f=findMov(id);return f?S.movs[f[0]].items[f[1]]:null}
function addMov(m){m.id=m.id||uid();m.ts=Date.now();const k='mov-'+ym(m.date);(S.movs[k]||(S.movs[k]={items:[]})).items.push(m);Store.save(k);return m}
function updateMov(id,patch){
  const f=findMov(id);if(!f)return;const [k,i]=f;const m=Object.assign({},S.movs[k].items[i],patch);
  const nk='mov-'+ym(m.date);
  if(nk!==k){S.movs[k].items.splice(i,1);(S.movs[nk]||(S.movs[nk]={items:[]})).items.push(m);Store.save(k,nk)}
  else{S.movs[k].items[i]=m;Store.save(k)}
}
function delMov(id){
  const f=findMov(id);if(!f)return;const [k,i]=f;const m=S.movs[k].items[i];S.movs[k].items.splice(i,1);Store.save(k);
  if(m.occId&&S.pay.items[m.occId]){delete S.pay.items[m.occId];Store.save('pay')}
  if(m.tradeId){const t=S.inv.trades.find(x=>x.id===m.tradeId);if(t){delete t.movId;Store.save('inv')}}
}
const acc=id=>C().accounts.find(a=>a.id===id);
const isPersonal=id=>{const a=acc(id);return !a||a.personal!==false};
const ecat=id=>C().expCats.find(c=>c.id===id)||{name:'Sin categoría',emoji:'❔'};
const icat=id=>C().incCats.find(c=>c.id===id)||{name:'Ingreso',emoji:'💰'};
const pocket=id=>C().pockets.find(p=>p.id===id);

function accBalance(a,upto){
  let b=a.initial||0;
  for(const m of allMovs()){
    if(upto&&m.date>upto)continue;
    if(m.accountId===a.id){
      if(m.type==='income')b+=m.amount;
      else if(m.type==='expense')b-=m.amount;
      else if(m.type==='adjust')b+=m.amount;
      else if(m.type==='transfer')b-=m.amount;
      else if(m.type==='invest')b+=(m.dir==='sell'?m.amount:-m.amount);
    }
    if(m.type==='transfer'&&m.toAccountId===a.id)b+=(m.toAmount??m.amount);
  }
  return r2(b);
}
function pocketBalance(p,upto){
  let b=0;
  for(const m of allMovs()){
    if(m.type!=='pocket'||(upto&&m.date>upto))continue;
    if(m.dir==='in'&&m.pocketId===p.id)b+=m.amount;
    if(m.dir==='out'&&m.pocketId===p.id)b-=m.amount;
    if(m.dir==='move'){if(m.pocketId===p.id)b-=m.amount;if(m.toPocketId===p.id)b+=(m.toAmount??m.amount)}
  }
  return r2(b);
}
function pocketTarget(p){
  if(p.kind==='edu'||p.kind==='shop')return sum(p.items||[],it=>conv(num(it.price),it.cur||p.cur,p.cur));
  return p.target||0;
}

/* =========================================================
   PAGOS PROGRAMADOS (gastos fijos e ingresos recurrentes)
   ========================================================= */
function monthlyEq(f){return f.freq==='weekly'?f.amount*52/12:f.amount}
function occs(fromISO,toISO,opts={}){
  const res=[];const F=C().fixed.filter(f=>f.active||opts.all);const I=C().incomes.filter(i=>i.active||opts.all);
  const mk=(src,kind,d)=>{const id=src.id+'@'+d;const st=S.pay.items[id]||{};return {id,src,kind,date:d,amount:st.amount??src.amount,cur:src.cur||'PEN',status:st.status||'pending',movId:st.movId,paidAt:st.paidAt}};
  for(let m=ym(fromISO);m<=ym(toISO);m=addMonths(m,1)){
    const [y,mo]=m.split('-').map(Number);
    for(const f of F){
      if(f.start&&m<ym(f.start))continue;if(f.end&&m>ym(f.end))continue;
      if(f.freq==='weekly'){
        for(let day=1;day<=dim(y,mo);day++){const d=m+'-'+pad(day);if(parseISO(d).getDay()===(+f.weekday||0)&&d>=fromISO&&d<=toISO&&(!f.start||d>=f.start)&&(!f.end||d<=f.end))res.push(mk(f,'out',d))}
      }else{
        const d=m+'-'+pad(Math.min(+f.day||1,dim(y,mo)));
        if(d>=fromISO&&d<=toISO&&(!f.start||d>=f.start))res.push(mk(f,'out',d));
      }
    }
    for(const i of I){
      if(i.from&&m<i.from)continue;if(i.to&&m>i.to)continue;
      const d=m+'-'+pad(Math.min(+i.day||30,dim(y,mo)));
      if(d>=fromISO&&d<=toISO)res.push(mk(i,'in',d));
    }
  }
  return res.sort((a,b)=>a.date.localeCompare(b.date));
}

/* =========================================================
   INVERSIONES
   ========================================================= */
function holdings(){
  const H={};
  const tr=[...S.inv.trades].sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
  for(const t of tr){
    const k=t.ticker.toUpperCase();
    const h=H[k]||(H[k]={ticker:k,name:t.name||k,kind:t.kind,platform:t.platform,cur:t.cur,qty:0,cost:0,realized:0,fees:0,first:t.date});
    const q=num(t.qty),p=num(t.price),fee=num(t.fee);
    h.fees+=fee;
    if(t.side==='buy'){h.cost+=q*p+fee;h.qty+=q}
    else{const avg=h.qty?h.cost/h.qty:0;const sq=Math.min(q,h.qty);h.realized+=sq*p-fee-avg*sq;h.cost-=avg*sq;h.qty-=sq}
    if(t.name)h.name=t.name;if(t.platform)h.platform=t.platform;
  }
  return Object.values(H).map(h=>{
    const pr=S.inv.prices[h.ticker];
    h.price=pr?conv(pr.price,pr.cur||h.cur,h.cur):null;h.priceDate=pr?pr.date:null;h.priceSrc=pr?pr.src:'';
    h.avg=h.qty>1e-9?h.cost/h.qty:0;
    h.value=h.qty>1e-9?(h.price!=null?h.qty*h.price:h.cost):0;
    h.unreal=h.price!=null&&h.qty>1e-9?h.value-h.cost:0;
    h.ret=h.cost>0?h.unreal/h.cost:0;
    return h;
  });
}
function investValue(){
  const H=holdings();
  return {H,valuePEN:sum(H,h=>toPEN(h.value,h.cur)),costPEN:sum(H,h=>toPEN(h.qty>1e-9?h.cost:0,h.cur)),realPEN:sum(H,h=>toPEN(h.realized,h.cur)),unrealPEN:sum(H,h=>toPEN(h.unreal,h.cur)),noPrice:H.filter(h=>h.qty>1e-9&&h.price==null).length};
}
function investCostAt(dateISO){
  const H={};
  for(const t of [...S.inv.trades].filter(t=>t.date<=dateISO).sort((a,b)=>a.date.localeCompare(b.date))){
    const h=H[t.ticker]||(H[t.ticker]={qty:0,cost:0,cur:t.cur});const q=num(t.qty),p=num(t.price),fee=num(t.fee);
    if(t.side==='buy'){h.cost+=q*p+fee;h.qty+=q}else{const avg=h.qty?h.cost/h.qty:0;const sq=Math.min(q,h.qty);h.cost-=avg*sq;h.qty-=sq}
  }
  return sum(Object.values(H),h=>toPEN(h.cost,h.cur));
}

   TOTALES Y ESTADÍSTICAS
   ========================================================= */
function totals(){
  const pers=C().accounts.filter(a=>a.personal!==false);
  const cash=sum(pers,a=>toPEN(accBalance(a),a.cur));
  const pockets=sum(C().pockets,p=>toPEN(pocketBalance(p),p.cur));
  const pend=pendingOut();
  const committed=sum(pend,o=>toPEN(o.amount,o.cur));
  const iv=investValue();
  const other=sum(C().otherAssets,x=>toPEN(num(x.value),x.cur));
  const debt=sum(C().debts,x=>toPEN(num(x.balance),x.cur));
  const suyay=sum(C().accounts.filter(a=>a.personal===false),a=>toPEN(accBalance(a),a.cur));
  return {cash,pockets,committed,pendCount:pend.length,free:cash-pockets-committed,inv:iv.valuePEN,iv,other,debt,net:cash+iv.valuePEN+other-debt,suyay};
}
function monthStats(m){
  let inc=0,exp=0,fixedExp=0;const byCat={},byInc={};
  for(const x of allMovs()){
    if(ym(x.date)!==m||!isPersonal(x.accountId))continue;
    const v=toPEN(x.amount,x.cur);
    if(x.type==='income'){inc+=v;byInc[x.catId]=(byInc[x.catId]||0)+v}
    if(x.type==='expense'){exp+=v;byCat[x.catId]=(byCat[x.catId]||0)+v;if(x.fixedId)fixedExp+=v}
  }
  return {inc,exp,net:inc-exp,byCat,byInc,fixedExp,varExp:exp-fixedExp,rate:inc>0?(inc-exp)/inc:null};
}
function rangeExp(fromISO,toISO,filter){let s=0;for(const x of allMovs()){if(x.type==='expense'&&x.date>=fromISO&&x.date<=toISO&&isPersonal(x.accountId)&&(!filter||filter(x)))s+=toPEN(x.amount,x.cur)}return s}
function hasHistory(m){return allMovs().some(x=>ym(x.date)===m&&x.type==='expense'&&isPersonal(x.accountId))}

function essentials(){
  const P=C().plan;
  const fixedEss=sum(C().fixed.filter(f=>f.active&&f.essential),f=>toPEN(monthlyEq(f),f.cur));
  const essIds=C().expCats.filter(c=>c.essential).map(c=>c.id);
  const cm=ym(today());
  const months=[1,2,3].map(i=>addMonths(cm,-i)).filter(hasHistory);
  let varAvg=0,src='';
  if(months.length){varAvg=sum(months,m=>rangeExp(m+'-01',monthEnd(m),x=>essIds.includes(x.catId)&&!x.fixedId))/months.length;src='promedio real de '+months.length+' mes(es) completo(s) en tus categorías esenciales'}
  else{
    const b=sum(C().expCats.filter(c=>c.essential),c=>c.budget||0);
    if(b>0){varAvg=b;src='tus presupuestos de categorías esenciales'}
    else if(hasHistory(cm)){const d=parseISO(today()).getDate();varAvg=rangeExp(cm+'-01',today(),x=>essIds.includes(x.catId)&&!x.fixedId)/Math.max(d,7)*30;src='lo que llevas gastado este mes, proyectado a 30 días (dato preliminar)'}
    else src='';
  }
  let total=fixedEss+varAvg;
  if(P.essOverride>0){total=P.essOverride;src='el monto mensual que definiste manualmente'}
  return {total,fixedEss,varAvg,src,ready:total>0&&(src!==''||P.essOverride>0)};
}

function expectedIncome(m){return sum(C().incomes.filter(i=>i.active&&(!i.from||m>=i.from)&&(!i.to||m<=i.to)),i=>toPEN(i.amount,i.cur))}
function capacity(){
  const cm=ym(today());
  const next=[0,1,2].map(i=>addMonths(cm,i));
  const incExp=sum(next,expectedIncome)/3;
  const fixedM=sum(C().fixed.filter(f=>f.active),f=>toPEN(monthlyEq(f),f.cur));
  const months=[1,2,3].map(i=>addMonths(cm,-i)).filter(hasHistory);
  let varSpend,varSrc,assumed=false;
  if(months.length){varSpend=sum(months,m=>rangeExp(m+'-01',monthEnd(m),x=>!x.fixedId))/months.length;varSrc='promedio de tus gastos variables reales ('+months.length+' mes(es))'}
  else{
    const b=sum(C().expCats,c=>c.budget||0);
    if(b>0){varSpend=b;varSrc='la suma de tus presupuestos por categoría'}
    else{varSpend=incExp*0.5;varSrc='un supuesto prudente del 50% de tu ingreso para gastos variables (aún no hay historial ni presupuestos)';assumed=true}
  }
  const raw=incExp-fixedM-varSpend;
  const pool=Math.max(0,raw)*0.8;
  const lastTo=C().incomes.filter(i=>i.active&&i.to).map(i=>i.to).sort().pop();
  const endsSoon=lastTo&&lastTo<=addMonths(cm,5)?lastTo:null;
  return {incExp,fixedM,varSpend,varSrc,assumed,raw,pool,endsSoon};
}

function planTravel(){
  const P=C().plan.travel,R=REF.travel,ov=P.ov||{};const st=P.style,se=P.season;
  const night=R.hotel[st]*R.season[se];
  const L={};
  L.flight=ov.flight??R.flights[se];
  L.lodging=ov.lodging??(P.lodging==='familia'?R.family:P.nights*(night*(1+R.tax.pct/100)+R.tax.fixed));
  L.food=ov.food??R.food[st]*(P.nights+1);
  L.transport=ov.transport??R.transport[st];
  L.activities=ov.activities??R.activities[st];
  L.insurance=ov.insurance??R.insurance[st];
  L.extras=ov.extras??R.extras[st];
  const sub=sum(Object.values(L));const cont=sub*(P.cont||0)/100;
  const total=Math.round((sub+cont)/10)*10;
  return {L,sub,cont,total,low:Math.round(total*0.85/10)*10,high:Math.round(total*1.2/10)*10,night,visa:R.visa};
}
const TRAVEL_LBL={flight:'✈️ Vuelo Lima–Nueva York (ida y vuelta)',lodging:'🛏️ Alojamiento',food:'🍕 Alimentación',transport:'🚇 Transporte local (metro, PATH a NJ, aeropuerto)',activities:'🗽 Actividades y entradas',insurance:'🩺 Seguro de viaje',extras:'🛍️ Gastos adicionales'};

function planHome(){

  const i=Math.pow(1+P.tea/100,1/12)-1,n=P.years*12;

function carModel(){const P=C().plan.car;const m=REF.car.models.find(x=>x.id===P.model)||REF.car.models[0];const price=P.customPrice>0?P.customPrice:m.price;return {...m,price}}
function planCar(){
  const P=C().plan.car,m=carModel();const price=m.price;
  const down=P.financed?price*P.down/100:price;

  const yearly=ins+soat+maint*2+ (cuota*12);

function planEmergency(){const e=essentials();return {e,l1:e.total*3,l2:e.total*6}}
function planFI(){const e=essentials();const annual=e.total*12;const swr=C().plan.fi.swr||4;return {e,annual,target:annual/(swr/100),swr,conservative:annual/0.035}}

function goalEstimate(p){
  if(p.kind==='emergency'){const x=planEmergency();if(!x.e.ready)return null;const lvl2=pocketBalance(p)>=x.l1&&x.l1>0;return {value:Math.round((lvl2?x.l2:x.l1)/10)*10,cur:'PEN',src:'3 y 6 meses de tus gastos esenciales ('+moneyT(x.e.total)+'/mes, según '+x.e.src+')',date:today()}}
  if(p.kind==='travel'){const t=planTravel();return {value:t.total,cur:'USD',src:'Planificador de viaje con '+REF.travel.seasonTxt[C().plan.travel.season].toLowerCase()+', estilo '+C().plan.travel.style+(C().plan.travel.lodging==='familia'?', alojándote con familia':''),date:REF.updated,url:REF.travel.flightsUrl}}
  if(p.kind==='visa')return {value:REF.travel.visa,cur:'USD',src:REF.travel.visaSrc,date:REF.updated,url:REF.travel.visaUrl};
  if(p.kind==='home'){const h=planHome();return {value:Math.round(h.need/100)*100,cur:'PEN',src:'Inicial '+C().plan.home.down+'% + gastos de cierre + reserva de 6 meses para un dúplex de '+C().plan.home.m2+' m² en '+C().plan.home.district,date:REF.updated,url:REF.home.m2Url}}
  if(p.kind==='car'){const c=planCar();if(!c.price)return null;return {value:Math.round(c.need/10)*10,cur:'USD',src:(C().plan.car.financed?'Inicial '+C().plan.car.down+'%':'Pago al contado')+' + seguro año 1 + SOAT + trámites + mantenimiento inicial · '+c.m.name,date:REF.updated,url:c.m.url}}
  if(p.kind==='fi'){const f=planFI();if(!f.e.ready)return null;return {value:Math.round(f.target/100)*100,cur:'PEN',src:'Regla del '+f.swr+'%: gastos esenciales anuales ('+moneyT(f.annual,'PEN',0)+') ÷ '+(f.swr/100),date:today()}}
  return null;
}

/* Prioriza y reparte tu capacidad real de ahorro entre metas */
function allocate(){
  const cap=capacity();let pool=cap.pool;
  const em=C().pockets.find(p=>p.kind==='emergency');
  const emerOK=em&&pocketTarget(em)>0&&pocketBalance(em)>=planEmergency().l1&&planEmergency().l1>0;
  const goals=C().pockets.map(p=>{
    const target=pocketTarget(p),saved=pocketBalance(p);
    const remaining=Math.max(0,target-saved);
    const remPEN=toPEN(remaining,p.cur);
    const monthsLeft=p.due?Math.max(1,monthsBetween(today(),p.due)):null;
    const needPEN=monthsLeft?remPEN/monthsLeft:null;
    return {p,target,saved,remaining,remPEN,monthsLeft,needPEN,rec:0};
  });
  const tiers={urgente:0.6,importante:0.3,aspiracional:0.1};
  const active=g=>g.remPEN>0&&g.p.kind!=='invest';
  const present=Object.keys(tiers).filter(t=>goals.some(g=>active(g)&&g.p.priority===t));
  const wsum=sum(present,t=>tiers[t]);
  let leftover=0;
  for(const t of present){
    let tierPool=pool*tiers[t]/wsum;
    const gs=goals.filter(g=>active(g)&&g.p.priority===t);
    const W=gs.map(g=>g.needPEN||g.remPEN/24);const Wt=sum(W);
    gs.forEach((g,ix)=>{const share=tierPool*W[ix]/Wt;g.rec=Math.min(share,g.remPEN);leftover+=share-g.rec});
  }
  // reparte sobrante a metas que aún necesitan, por prioridad
  for(const t of ['urgente','importante','aspiracional']){for(const g of goals.filter(g=>active(g)&&g.p.priority===t)){if(leftover<=0)break;const extra=Math.min(leftover,g.remPEN-g.rec);g.rec+=extra;leftover-=extra}}
  // capital de inversión: solo si el fondo de emergencia nivel 1 está completo
  const gi=goals.find(g=>g.p.kind==='invest');
  if(gi){gi.rec=emerOK?Math.max(0,Math.min(Math.max(leftover,cap.pool*0.1),cap.pool*0.2)):0;gi.invReason=emerOK?'Tu fondo de emergencia nivel 1 está completo: puedes destinar un aporte pequeño y constante.':'Primero completa tu fondo de emergencia (nivel 1). Invertir sin colchón te obligaría a vender en un mal momento si surge un imprevisto.'}
  goals.forEach(g=>{
    g.recCur=fromPEN(g.rec,g.p.cur);
    g.eta=g.rec>0&&g.remPEN>0?Math.ceil(g.remPEN/g.rec):null;
    g.etaDate=g.eta?addMonths(ym(today()),g.eta)+'-01':null;
    g.late=g.p.due&&g.needPEN&&g.rec+1<g.needPEN;
    g.est=goalEstimate(g.p);
  });
  return {cap,goals,emerOK};
}

function weekStart(s){const d=parseISO(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return isoD(d)}
function insights(){
  const out=[];const t=today(),cm=ym(t),pm=addMonths(cm,-1);
  const st=monthStats(cm),pv=monthStats(pm);const dayN=parseISO(t).getDate(),dTot=dim(+cm.slice(0,4),+cm.slice(5));
  const T=totals(),A=allocate();
  // presupuesto
  for(const c of C().expCats.filter(c=>c.budget>0)){
    const sp=st.byCat[c.id]||0,pc=sp/c.budget;
    if(pc>=1)out.push({lv:'danger',ic:'🚨',t:`Superaste tu presupuesto de ${c.emoji} ${c.name}`,b:`Llevas ${moneyT(sp)} de ${moneyT(c.budget)} (${Math.round(pc*100)}%). Cada sol extra aquí sale de tu ahorro del mes. Pausa esta categoría hasta fin de mes o mueve presupuesto desde otra.`});
    else if(pc>=0.8)out.push({lv:'warn',ic:'⚠️',t:`${c.emoji} ${c.name} al ${Math.round(pc*100)}% del presupuesto`,b:`Te quedan ${moneyT(c.budget-sp)} para ${dTot-dayN} días (≈${moneyT((c.budget-sp)/Math.max(1,dTot-dayN))}/día).`});
  }
  // picos vs mes anterior (comparando el mismo avance del mes)
  const prevSame=(id)=>rangeExp(pm+'-01',pm+'-'+pad(Math.min(dayN,dim(+pm.slice(0,4),+pm.slice(5)))),x=>x.catId===id);
  for(const c of C().expCats){const now=st.byCat[c.id]||0,before=prevSame(c.id);if(before>0&&now>before*1.3&&now-before>=50)out.push({lv:'warn',ic:'📈',t:`${c.emoji} ${c.name}: +${Math.round((now/before-1)*100)}% vs. el mes pasado`,b:`A esta altura del mes pasado llevabas ${moneyT(before)}; hoy vas ${moneyT(now)}. Revisa si fue algo puntual o un hábito nuevo.`})}
  // semana vs promedio
  const ws=weekStart(t);const thisW=rangeExp(ws,t);
  const prevWs=[1,2,3,4].map(i=>rangeExp(addDays(ws,-7*i),addDays(ws,-7*i+6)));const hasPrev=prevWs.some(v=>v>0);
  const avgW=sum(prevWs)/4;
  if(hasPrev&&avgW>0){const pc=thisW/avgW;out.push({lv:pc>1.2?'warn':'ok',ic:pc>1.2?'🧾':'✅',t:`Esta semana: ${moneyT(thisW)} vs. ${moneyT(avgW)} de promedio`,b:pc>1.2?`Vas ${Math.round((pc-1)*100)}% por encima de tus últimas 4 semanas.`:'Vas dentro de tu ritmo habitual. ¡Bien!'})}
  // cuánto puedo gastar
  const sts=safeToSpend();
  out.push({lv:sts.perDay>0?'info':'danger',ic:'🧮',t:`Puedes gastar ≈${moneyT(Math.max(0,sts.perDay))} al día sin tocar tus ahorros`,b:`Cálculo: dinero libre ${moneyT(T.free)} − ingresos ya contados − aportes a metas pendientes este mes (${moneyT(sts.goalsLeft)}) − colchón de ${moneyT(sts.buffer)} = ${moneyT(sts.spendable)} para ${sts.days} días.`});
  // proyección fin de mes
  const pr=projection();
  out.push({lv:pr.end>=0?'info':'danger',ic:'🔮',t:`Proyección al cierre de ${MESL[+cm.slice(5)-1]}: ${moneyT(pr.end)} en cuentas`,b:`Hoy: ${moneyT(pr.cash)} · + ingresos por recibir ${moneyT(pr.inc)} · − pagos fijos pendientes ${moneyT(pr.fixed)} · − gasto variable estimado ${moneyT(pr.varLeft)} (a tu ritmo de ${moneyT(pr.pace)}/día).`});
  // patrones
  const last60=allMovs().filter(x=>x.type==='expense'&&isPersonal(x.accountId)&&daysAgo(x.date)<=60&&daysAgo(x.date)>=0);
  if(last60.length>=8){
    const byDow=[0,0,0,0,0,0,0];last60.forEach(x=>byDow[parseISO(x.date).getDay()]+=toPEN(x.amount,x.cur));
    const top=byDow.indexOf(Math.max(...byDow));
    out.push({lv:'info',ic:'🔍',t:`Gastas más los ${DIAS[top]}`,b:`En los últimos 60 días, el ${Math.round(byDow[top]/sum(byDow)*100)}% de tu gasto cayó en ${DIAS[top]}. Planear ese día (llevar algo de comer, decidir antes qué compras) tiene mucho impacto.`});
    const cafes=last60.filter(x=>x.catId==='cafes');if(cafes.length>=4)out.push({lv:'info',ic:'☕',t:`${cafes.length} cafés en 60 días = ${moneyT(sum(cafes,x=>toPEN(x.amount,x.cur)))}`,b:`Al año serían ≈${moneyT(sum(cafes,x=>toPEN(x.amount,x.cur))*6,'PEN',0)}. No es para eliminarlos: decide un número por semana que sí disfrutes.`});
  }
  // ahorro recomendado
  const cap=A.cap;
  if(cap.raw<=0)out.push({lv:'danger',ic:'🛑',t:'Hoy tus gastos estimados igualan o superan tus ingresos',b:`Ingreso esperado ${moneyT(cap.incExp)}/mes − fijos ${moneyT(cap.fixedM)} − variables ${moneyT(cap.varSpend)} (${cap.varSrc}). Antes de ahorrar para metas, ajusta presupuestos o busca un ingreso extra.`});
  else out.push({lv:'ok',ic:'💡',t:`Recomendación: ahorra ${moneyT(cap.pool,'PEN',0)} al mes`,b:`Es el 80% de tu sobrante estimado (${moneyT(cap.raw,'PEN',0)}). El 20% restante queda como margen para imprevistos. ${A.emerOK?'Como ya tienes tu fondo de emergencia base, una parte puede ir a inversión.':'Prioridad: fondo de emergencia; invertir viene después.'}`});
  if(cap.endsSoon)out.push({lv:'warn',ic:'📆',t:`Tu sueldo registrado termina en ${fmtYM(cap.endsSoon)}`,b:'Después de esa fecha la app no asume ingresos (tus ingresos variables no se proyectan). Si renuevas o consigues otro ingreso, actualízalo en Ajustes → Ingresos recurrentes.'});
  if(cap.assumed)out.push({lv:'info',ic:'📝',t:'Tus recomendaciones aún usan un supuesto',b:'Asumo que el 50% de tu ingreso va a gastos variables. Registra tus gastos un mes o define presupuestos por categoría y todo se recalcula con tus datos reales.'});
  return out;
}
function safeToSpend(){
  const t=today(),cm=ym(t);const T=totals();const A=allocate();
  const days=dim(+cm.slice(0,4),+cm.slice(5))-parseISO(t).getDate()+1;
  const contributed=sum(allMovs().filter(m=>m.type==='pocket'&&m.dir==='in'&&ym(m.date)===cm),m=>{const p=pocket(m.pocketId);return toPEN(m.amount,p?p.cur:'PEN')});
  const planned=sum(A.goals,g=>g.rec);
  const goalsLeft=Math.max(0,planned-contributed);
  const buffer=Math.max(50,A.cap.incExp*0.05);
  const spendable=T.free-goalsLeft-buffer;
  return {days,goalsLeft,buffer,spendable,perDay:spendable/days};
}
function projection(){
  const t=today(),cm=ym(t),T=totals();const dayN=parseISO(t).getDate(),dTot=dim(+cm.slice(0,4),+cm.slice(5));
  const inc=sum(pendingIn(),o=>toPEN(o.amount,o.cur));
  const fixed=sum(occs(cm+'-01',monthEnd(cm)).filter(o=>o.kind==='out'&&o.status==='pending'),o=>toPEN(o.amount,o.cur));
  const varSoFar=rangeExp(cm+'-01',t,x=>!x.fixedId);
  const pace=varSoFar/dayN;const varLeft=pace*(dTot-dayN);
  return {cash:T.cash,inc,fixed,varLeft,pace,end:T.cash+inc-fixed-varLeft};
}
function alertsList(){
  const A=[];const t=today();const lim=addDays(t,C().alerts.daysBefore||3);
  for(const o of pendingOut(addDays(t,C().alerts.daysBefore||3))){
    if(o.date<t)A.push({lv:'danger',ic:o.src.emoji,t:`${o.src.name} vencido (${fmtDate(o.date)})`,o});
    else if(o.date<=lim)A.push({lv:'warn',ic:o.src.emoji,t:`${o.src.name} vence ${o.date===t?'hoy':'el '+fmtDate(o.date)}`,o});
  }
  const st=monthStats(ym(t));
  for(const c of C().expCats.filter(c=>c.budget>0)){const sp=st.byCat[c.id]||0;if(sp>=c.budget)A.push({lv:'danger',ic:c.emoji,t:`Superaste el presupuesto de ${c.name}`});else if(sp>=c.budget*0.8)A.push({lv:'warn',ic:c.emoji,t:`${c.name} al ${Math.round(sp/c.budget*100)}% del presupuesto`})}
  for(const g of allocate().goals){if(g.est&&g.est.value>0&&Math.abs(g.est.value-g.target)/Math.max(1,g.target)>0.05&&g.p.kind!=='edu'&&g.p.kind!=='shop')A.push({lv:'info',ic:g.p.emoji,t:`Nueva estimación para ${g.p.name}: ${moneyT(g.est.value,g.est.cur,0)} (tu meta: ${moneyT(g.target,g.p.cur,0)})`,goal:g.p.id})}
  if(daysAgo(REF.updated)>120)A.push({lv:'info',ic:'🗓️',t:'Los precios de referencia tienen más de 4 meses: pídele a Claude que los actualice'});
  return A;
}

function movRow(m){
  let e,t,s,amt,cls='';
  const a=acc(m.accountId);const an=a?a.emoji+' '+a.name:'';
  if(m.type==='expense'){const c=ecat(m.catId);e=c.emoji;t=m.note||c.name;s=c.name+' · '+an;amt='−'+moneyT(m.amount,m.cur);cls='neg'}
  else if(m.type==='income'){const c=icat(m.catId);e=c.emoji;t=m.note||c.name;s=c.name+' · '+an;amt='+'+moneyT(m.amount,m.cur);cls='pos'}
  else if(m.type==='transfer'){const b=acc(m.toAccountId);e='🔁';t='Transferencia propia';s=an+' → '+(b?b.emoji+' '+b.name:'');amt=moneyT(m.amount,m.cur)}
  else if(m.type==='pocket'){const p=pocket(m.pocketId),q=pocket(m.toPocketId);e=p?p.emoji:'🎯';t=m.dir==='in'?'Apartado para '+(p?p.name:''):m.dir==='out'?'Liberado de '+(p?p.name:''):'Movido a '+(q?q.name:'');s=m.dir==='move'?(p?p.name:'')+' → '+(q?q.name:''):'Bolsillo · no cambia tu patrimonio';amt=moneyT(m.amount,p?p.cur:'PEN')}
  else if(m.type==='invest'){e='📈';t=(m.dir==='buy'?'Compra de ':'Venta de ')+(m.ticker||'inversión');s=an+' · inversión';amt=(m.dir==='buy'?'−':'+')+moneyT(m.amount,m.cur);cls=m.dir==='buy'?'':'pos'}
  else if(m.type==='adjust'){e='🧮';t='Ajuste de saldo';s=an;amt=(m.amount>=0?'+':'−')+moneyT(Math.abs(m.amount),m.cur)}
  if(m.note&&m.type!=='expense'&&m.type!=='income')s+=' · '+m.note;
  return `<div class="rowi click" data-act="editMov" data-id="${m.id}"><div class="emo">${e}</div><div class="main"><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div></div><div class="amt ${cls}"><span class="money">${amt}</span></div></div>`;
}
function occRow(o,compact){
  const late=o.date<today();const paid=o.status==='paid',sk=o.status==='skipped';
  const st=paid?`<span class="chip ok">✓ ${o.kind==='in'?'Recibido':'Pagado'}</span>`:sk?'<span class="chip">Omitido</span>':late?'<span class="chip danger">Vencido</span>':'';
  const btn=paid||sk?`<button class="linkbtn" data-act="undoOcc" data-id="${o.id}">Deshacer</button>`:`<button class="btn sm ${o.kind==='in'?'pist':'wine'}" data-act="payOcc" data-id="${o.id}">${o.kind==='in'?'✓ Recibido':'Pagar'}</button>`;
  return `<div class="rowi"><div class="emo">${o.src.emoji}</div><div class="main"><div class="t">${esc(o.src.name)} ${st}</div><div class="s">${o.kind==='in'?'Ingreso esperado':'Vence'} ${fmtDate(o.date)}${compact?'':' · '+(o.src.freq==='weekly'?'semanal':'mensual')}</div></div><div class="amt ${o.kind==='in'?'pos':''}">${money(o.amount,o.cur)}</div>${btn}</div>`;
}

function emptyBox(e,t,act){return `<div class="empty"><div class="e">${e}</div><div>${t}</div>${act||''}</div>`}

function goalExplain(g){
  const p=g.p,cap=allocate().cap;
  if(p.kind==='emergency'){const x=planEmergency();return x.e.ready?`<p><b>Por qué existe:</b> es el colchón que evita endeudarte si pierdes un ingreso o tienes un gasto médico o urgente.</p><p><b>Nivel 1 (3 meses):</b> ${moneyT(x.l1,'PEN',0)}. Cubre una emergencia típica mientras te reorganizas.<br><b>Nivel 2 (6 meses):</b> ${moneyT(x.l2,'PEN',0)}. Te da calma si tus ingresos son variables (como los de proyectos y charlas).</p><p><b>Cálculo:</b> gastos esenciales de ${moneyT(x.e.total)}/mes = fijos esenciales ${moneyT(x.e.fixedEss)} + variables esenciales ${moneyT(x.e.varAvg)} (${x.e.src}).</p>`:`<p>Para calcularlo necesito tus gastos esenciales reales. Registra tus gastos durante un mes, o define presupuestos en las categorías marcadas como esenciales (Comida, Transporte, Salud, Hogar, Educación), o escribe tu gasto esencial mensual en el planificador de abajo.</p>`}
  if(p.kind==='travel'){const t=planTravel();return `<p>${Object.entries(t.L).map(([k,v])=>`${TRAVEL_LBL[k]}: <b>${moneyT(v,'USD',0)}</b>`).join('<br>')}<br>➕ Imprevistos (${C().plan.travel.cont}%): <b>${moneyT(t.cont,'USD',0)}</b><br>= <b>${moneyT(t.total,'USD',0)}</b> (rango ${moneyT(t.low,'USD',0)}–${moneyT(t.high,'USD',0)})</p><p class="small muted">Ajusta temporada, estilo y alojamiento en el planificador.</p>`}
  if(p.kind==='visa')return `<p>${REF.travel.visaSrc} Sepárala del presupuesto del viaje porque se paga antes de la cita consular, aunque el viaje se postergue.</p>`;
  if(p.kind==='home'){const h=planHome(),P=C().plan.home;return `<p>No necesitas pagar el dúplex al contado: lo que ahorras es lo que el banco no financia, más un colchón.</p><p>Precio estimado: <b>${moneyT(h.price,'PEN',0)}</b> (≈${moneyT(fromPEN(h.price,'USD'),'USD',0)})<br>➕ Inicial ${P.down}%: <b>${moneyT(h.down,'PEN',0)}</b><br>➕ Gastos de cierre ${P.closing}%: <b>${moneyT(h.closing,'PEN',0)}</b><br>➕ Reserva 6 meses (cuota + seguro + mantenimiento): <b>${moneyT(h.reserve,'PEN',0)}</b><br>= <b>${moneyT(h.need,'PEN',0)}</b></p><p class="small">Cuota estimada: ${moneyT(h.cuota,'PEN',0)}/mes a ${P.years} años y ${P.tea}% TEA. Para que un banco la apruebe necesitarías un ingreso de ≈${moneyT(h.incomeNeeded,'PEN',0)}/mes (cuota ≤ ${P.dti}% del ingreso). Es una meta de largo plazo y está bien que lo sea.</p>`}
  if(p.kind==='car'){const c=planCar(),P=C().plan.car;if(!c.price)return '<p>Elige un modelo con precio o escribe la cotización que te den en el concesionario.</p>';return `<p><b>${esc(c.m.name)}</b>: ${moneyT(c.price,'USD',0)}<br>➕ ${P.financed?'Inicial '+P.down+'%':'Pago al contado'}: <b>${moneyT(c.down,'USD',0)}</b><br>➕ Seguro vehicular año 1 (${P.insPct}%): <b>${moneyT(c.ins,'USD',0)}</b><br>➕ SOAT: <b>${moneyT(c.soat,'USD',0)}</b> · Placas, inscripción y trámites: <b>${moneyT(c.tram,'USD',0)}</b><br>➕ Mantenimiento inicial: <b>${moneyT(c.maint,'USD',0)}</b><br>= <b>${moneyT(c.need,'USD',0)}</b></p>${P.financed?`<p class="small">Cuota estimada: ${moneyT(c.cuota,'USD',0)}/mes por ${P.years} años (TEA supuesta ${P.tea}%, confírmala con el banco).</p>`:''}`}
  if(p.kind==='fi'){const f=planFI();return f.e.ready?`<p><b>Paso 1:</b> un año de gastos esenciales = <b>${moneyT(f.annual,'PEN',0)}</b>.</p><p><b>Paso 2 (largo plazo):</b> con la “regla del ${f.swr}%”, un patrimonio invertido de ${moneyT(f.target,'PEN',0)} podría cubrir esos gastos retirando ${f.swr}% al año. Con una regla más prudente del 3,5%: ${moneyT(f.conservative,'PEN',0)}.</p><p class="small"><b>Supuestos y riesgos:</b> la regla viene de estudios con datos históricos de EE.UU. (acciones y bonos); no garantiza nada. Una caída fuerte al inicio del retiro, la inflación peruana o el tipo de cambio pueden cambiar el resultado. Úsala como brújula, no como promesa de rentabilidad.</p>`:'<p>Primero necesito tus gastos esenciales reales (igual que el fondo de emergencia).</p>'}
  if(p.kind==='invest')return `<p>${g.invReason}</p><p class="small">El aporte sugerido es pequeño a propósito y no tiene que ser mensual. Antes de invertir, revisa la sección de educación en el Investment Hub: toda inversión puede perder valor.</p>`;
  if(p.kind==='edu'||p.kind==='shop')return `<p>El objetivo es la suma de los ${p.kind==='edu'?'programas':'artículos'} que agregues. No fijo un monto sin conocer qué quieres. Si no sabes el precio, escribe qué es y pídele a Claude (en el Asistente) un estimado.</p>`;
  return '';
}
VIEWS.metas=()=>{
  const A=allocate(),cap=A.cap;
  const pr={urgente:0,importante:1,aspiracional:2};
  const G=[...A.goals].sort((a,b)=>pr[a.p.priority]-pr[b.p.priority]);
  const card=g=>{
    const p=g.p,pc=g.target?g.saved/g.target:0;
    const diff=g.est&&g.est.value>0&&Math.abs(g.est.value-g.target)/Math.max(1,g.target)>0.05&&!['edu','shop'].includes(p.kind);
    const stale=g.est&&daysAgo(g.est.date)>120;
    return `<div class="card goal" id="goal-${p.id}">
      <div class="gh"><div class="emo">${p.emoji}</div><div style="flex:1;min-width:0"><b style="font-family:Figtree,system-ui,sans-serif;font-size:16px">${esc(p.name)}</b><div class="chips" style="margin-top:4px"><span class="chip ${p.priority}">${{urgente:'🔴 Urgente',importante:'🟡 Importante',aspiracional:'🟢 Aspiracional'}[p.priority]}</span>${g.late?'<span class="chip danger">Fecha exigente</span>':''}</div></div><button class="iconbtn" data-act="editGoal" data-id="${p.id}">✏️</button></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="big" style="font-size:22px;font-weight:800">${money(g.saved,p.cur,0)}</span><span class="small muted">de ${g.target?money(g.target,p.cur,0):'—'} · ${Math.round(pc*100)}%</span></div>
      ${bar(pc,p.priority==='urgente'?'wine':p.priority==='aspiracional'?'sea':'')}
      <div class="kv">
        <div><span>Aporte mensual sugerido</span><b>${money(g.recCur,p.cur,0)}</b></div>
        <div><span>Tiempo estimado</span><b>${g.remaining<=0&&g.target>0?'¡Lograda! 🎉':g.eta?(g.eta<12?g.eta+' meses':(g.eta/12).toFixed(1)+' años'):p.kind==='invest'?'Abierta':'—'}</b></div>
        <div><span>Fecha objetivo</span><b>${p.due?fmtDate(p.due):'Sin fecha'}</b></div>
        <div><span>${p.due?'Necesitarías al mes':'Fecha estimada'}</span><b>${p.due?money(fromPEN(g.needPEN||0,p.cur),p.cur,0):(g.etaDate?fmtYM(ym(g.etaDate)):'—')}</b></div>
      </div>
      ${g.late?`<div class="banner warn" style="margin:4px 0 0"><span>📆</span><div class="small">Con tu capacidad actual llegarías en <b>${g.etaDate?fmtYM(ym(g.etaDate)):'más tiempo'}</b>. <button class="linkbtn" data-act="useEta" data-id="${p.id}">Usar esa fecha</button> o ajusta prioridades.</div></div>`:''}
      ${diff?`<div class="banner info" style="margin:4px 0 0"><span>🔄</span><div class="small">Nueva estimación: <b>${moneyT(g.est.value,g.est.cur,0)}</b>. No cambio tu meta sin tu permiso. <button class="linkbtn" data-act="applyEst" data-id="${p.id}">Aplicar</button></div></div>`:''}
      ${stale?'<div class="small muted">⚠️ Referencia con más de 4 meses: conviene actualizarla.</div>':''}
      ${(p.kind==='edu'||p.kind==='shop')?`<div class="list">${(p.items||[]).map((it,ix)=>`<div class="rowi"><div class="main"><div class="t">${esc(it.name)}</div><div class="s">${it.note?esc(it.note):''}</div></div><div class="amt">${money(num(it.price),it.cur||p.cur,0)}</div><button class="linkbtn" data-act="delItem" data-id="${p.id}" data-ix="${ix}">✕</button></div>`).join('')}</div><button class="btn sm ghost" data-act="addItem" data-id="${p.id}">＋ Agregar ${p.kind==='edu'?'curso o programa':'artículo'}</button>`:''}
      ${srcLine(g.est&&!diff?g.est:p.est)}
      <details class="exp"><summary>¿Cómo se calculó?</summary>${goalExplain(g)}</details>
      <div class="btns"><button class="btn sm pist" data-act="pocketMove" data-id="${p.id}" data-dir="in">＋ Apartar</button><button class="btn sm ghost" data-act="pocketMove" data-id="${p.id}" data-dir="out">Liberar</button><button class="btn sm ghost" data-act="pocketMove" data-id="${p.id}" data-dir="move">Mover</button></div>
    </div>`;
  };
  return `
  <div class="card hero"><div class="lbl">🎯 Tu capacidad de ahorro estimada</div><div class="big">${money(cap.pool,'PEN',0)}<span style="font-size:16px;font-weight:600"> /mes</span></div>
    <div class="row"><span class="pill">💼 Ingreso esperado ${money(cap.incExp,'PEN',0)}</span><span class="pill">📌 Fijos ${money(cap.fixedM,'PEN',0)}</span><span class="pill">🧾 Variables ${money(cap.varSpend,'PEN',0)}</span></div>
    <div style="margin-top:12px;font-size:13px;opacity:.9">Uso el 80% de tu sobrante (${moneyT(Math.max(0,cap.raw),'PEN',0)}) y lo reparto: 60% urgentes, 30% importantes, 10% aspiracionales. Nunca te pido más de lo que te alcanza: si una fecha no es posible, te propongo otra.</div></div>
  ${cap.assumed?`<div class="banner info section"><span>📝</span><div class="small">Gastos variables: ${cap.varSrc}.</div></div>`:''}
  ${cap.endsSoon?`<div class="banner warn section"><span>📆</span><div class="small">Tu sueldo registrado termina en ${fmtYM(cap.endsSoon)}. No proyecto ingresos variables (proyectos, polos) porque no son seguros.</div></div>`:''}
  <div class="grid md2 section">${G.map(card).join('')}</div>
  <div class="btns section"><button class="btn" data-act="newGoal">＋ Nueva meta</button><button class="btn ghost" data-act="pocketMove" data-dir="move">🔁 Mover entre bolsillos</button></div>
  <h2 class="section" style="margin-top:26px">🧭 Planificador: descubre cuánto necesitas</h2>
  <div class="grid md2">${plannerTravel()}${plannerHome()}${plannerCar()}${plannerEssentials()}</div>`;
};

function plannerEssentials(){
  const e=essentials(),P=C().plan,f=planFI();

MOUNT.inversiones=()=>{
  const calc=()=>{const b=num($('#cr_buy').value),s=num($('#cr_sell').value),q=num($('#cr_qty').value),f=num($('#cr_fee').value);const cost=b*q+f,val=s*q,g=val-cost;$('#cr_out').innerHTML=`Inviertes <b>${moneyT(cost)}</b>, vale <b>${moneyT(val)}</b>.<br>Resultado: <b class="${g>=0?'pos':'neg'}">${moneyT(g)} (${cost?(g/cost*100).toFixed(2):0}%)</b>. Las comisiones se restan de tu ganancia.`};
  ['cr_buy','cr_sell','cr_qty','cr_fee'].forEach(id=>$('#'+id).addEventListener('input',calc));calc();
  const sim=()=>{const I=num($('#sm_init').value),M=num($('#sm_month').value),Y=Math.min(50,Math.max(1,num($('#sm_years').value)));const rates=[0.02,0.06,0.09];const labels=[];const data=rates.map(()=>[]);const contrib=[];
    for(let y=0;y<=Y;y++){labels.push('Año '+y);contrib.push(I+M*12*y);rates.forEach((r,ix)=>{const i=Math.pow(1+r,1/12)-1;const n=y*12;const fv=I*Math.pow(1+i,n)+(i?M*(Math.pow(1+i,n)-1)/i:M*n);data[ix].push(Math.round(fv))})}
    $('#sm_out').innerHTML=`Aportarías <b>${moneyT(contrib[Y],'PEN',0)}</b>. Pesimista 2%: ${moneyT(data[0][Y],'PEN',0)} · Base 6%: ${moneyT(data[1][Y],'PEN',0)} · Optimista 9%: ${moneyT(data[2][Y],'PEN',0)}.`;
    if(!chartsOK())return;if(UI.charts.sim)UI.charts.sim.destroy();
    UI.charts.sim=new Chart($('#chSim'),{type:'line',data:{labels,datasets:[{label:'Aportado',data:contrib,borderColor:'#4C1D03',borderDash:[4,4],pointRadius:0,borderWidth:2},{label:'2%',data:data[0],borderColor:'#A9C4BF',pointRadius:0,borderWidth:2},{label:'6%',data:data[1],borderColor:'#B39F02',pointRadius:0,borderWidth:2.5},{label:'9%',data:data[2],borderColor:'#690507',pointRadius:0,borderWidth:2}]},options:{maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+moneyT(c.raw,'PEN',0)}}},scales:{y:{ticks:{callback:v=>'S/'+(v>=1000?(v/1000)+'k':v)}},x:{ticks:{maxTicksLimit:6}}}}})};
  ['sm_init','sm_month','sm_years'].forEach(id=>$('#'+id).addEventListener('input',sim));sim();
  if($('#chInv')&&chartsOK()){
    const tr=[...S.inv.trades].sort((a,b)=>a.date.localeCompare(b.date));const dates=[...new Set(tr.map(t=>t.date))];
    Object.values(S.inv.priceHist||{}).forEach(arr=>arr.forEach(p=>dates.push(p.date)));const ds=[...new Set(dates)].sort();
    const cost=ds.map(d=>r2(investCostAt(d)));

      let v=0,ok=true;for(const k in H){if(H[k].qty<=1e-9)continue;const hist=(S.inv.priceHist[k]||[]).filter(p=>p.date<=d).sort((a,b)=>a.date.localeCompare(b.date));const last=hist[hist.length-1];if(!last){ok=false;break}v+=toPEN(H[k].qty*conv(last.price,last.cur,H[k].cur),H[k].cur)}return ok?r2(v):null});
    UI.charts.inv=new Chart($('#chInv'),{type:'line',data:{labels:ds.map(fmtDate),datasets:[{label:'Invertido',data:cost,borderColor:'#4C1D03',backgroundColor:'rgba(76,29,3,.06)',fill:true,stepped:true,pointRadius:2},{label:'Valor de mercado',data:val,borderColor:'#B39F02',spanGaps:true,pointRadius:3}]},options:{maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+moneyT(c.raw)}}}}});
  }
};

function netWorthSeries(n=12){
  const cm=ym(today());const ms=[];for(let i=n-1;i>=0;i--)ms.push(addMonths(cm,-i));
  const pers=C().accounts.filter(a=>a.personal!==false);const T=totals();
  return ms.map(m=>{const end=m===cm?today():monthEnd(m);const cash=sum(pers,a=>toPEN(accBalance(a,end),a.cur));const inv=m===cm?T.inv:investCostAt(end);return {m,v:r2(cash+inv+T.other-T.debt)}});
}

function openSheet(html,onMount){$('#sheet').innerHTML=html;$('#sheet-wrap').classList.add('open');document.body.style.overflow='hidden';onMount&&onMount($('#sheet'))}
function closeSheet(){$('#sheet-wrap').classList.remove('open');document.body.style.overflow='';$('#sheet').innerHTML=''}
$('#sheet-wrap').addEventListener('click',e=>{if(e.target.id==='sheet-wrap')closeSheet()});
const sheetHead=t=>`<div class="sheet-h"><h2>${t}</h2><button class="iconbtn" data-act="closeSheet">✕</button></div>`;
function confirmSheet(msg,okTxt,fn){openSheet(sheetHead('¿Seguro?')+`<p>${msg}</p><div class="btns"><button class="btn wine" id="cfOk">${okTxt||'Sí'}</button><button class="btn ghost" data-act="closeSheet">Cancelar</button></div>`,s=>$('#cfOk',s).onclick=()=>{closeSheet();fn()})}
const accOpts=(val,personalOnly)=>C().accounts.filter(a=>!personalOnly||a.personal!==false).map(a=>`<button type="button" class="selchip ${a.id===val?'on':''}" data-accid="${a.id}">${a.emoji} ${esc(a.name)}${a.cur==='USD'?' (US$)':''}</button>`).join('');

function movForm(type,m){
  m=m||{};const edit=!!m.id;const t=m.type||type||'expense';
  const accId=m.accountId||C().lastUsedAcc||C().accounts[0].id;
  const cats=t==='income'?C().incCats:C().expCats;
  const head=edit?'Editar movimiento':{expense:'Nuevo gasto',income:'Nuevo ingreso',transfer:'Transferencia propia',pocket:'Bolsillos'}[t];
  return sheetHead(head)+`
  ${edit?'':`<div class="seg">${[['expense','💸 Gasto'],['income','💚 Ingreso'],['transfer','🔁 Transferir']].map(([k,l])=>`<button class="${k===t?'on':''}" data-act="quickAdd" data-t="${k}">${l}</button>`).join('')}</div>`}
  <div class="amount-wrap"><span class="cur" id="mfCur">${SYM[acc(accId)?.cur||'PEN']}</span><input class="amount-inp" id="mfAmt" inputmode="decimal" placeholder="0.00" value="${m.amount??''}"></div>
  ${t==='transfer'?`
    <label class="f">Desde</label><div class="chips" id="mfAcc">${accOpts(accId)}</div>
    <label class="f">Hacia</label><div class="chips" id="mfTo">${C().accounts.map(a=>`<button type="button" class="selchip ${a.id===m.toAccountId?'on':''}" data-accid="${a.id}">${a.emoji} ${esc(a.name)}</button>`).join('')}</div>
    <div id="mfToAmtW" class="hidden"><label class="f">Monto que llega (moneda destino)</label><input class="inp" id="mfToAmt" inputmode="decimal" value="${m.toAmount??''}"></div>
  `:`
    <label class="f">Categoría</label><div class="catgrid" id="mfCat">${cats.map(c=>`<button type="button" class="catbtn ${c.id===m.catId?'on':''}" data-cat="${c.id}"><b>${c.emoji}</b>${esc(c.name)}</button>`).join('')}<button type="button" class="catbtn" data-act="newCatInline" data-k="${t==='income'?'inc':'exp'}"><b>＋</b>Nueva</button></div>
    <label class="f">Cuenta</label><div class="chips" id="mfAcc">${accOpts(accId)}</div>
  `}
  <label class="f">Fecha</label><div class="row2"><input class="inp" type="date" id="mfDate" value="${m.date||today()}"><div class="chips"><button type="button" class="selchip" data-day="0">Hoy</button><button type="button" class="selchip" data-day="-1">Ayer</button></div></div>
  <label class="f">Nota (opcional)</label><input class="inp" id="mfNote" value="${esc(m.note||'')}" placeholder="${t==='income'?'Ej.: proyecto con…':'Ej.: almuerzo con…'}">
  <div class="btns" style="margin-top:16px"><button class="btn ${t==='income'?'pist':'wine'} block" id="mfSave">${edit?'Guardar cambios':t==='income'?'Guardar ingreso':t==='transfer'?'Transferir':'Guardar gasto'}</button></div>
  ${edit?`<div class="btns" style="margin-top:10px"><button class="btn ghost block" id="mfDel">🗑️ Eliminar</button></div>`:''}`;
}
function mountMovForm(s,type,m){
  m=m||{};const t=m.type||type||'expense';
  let accId=m.accountId||C().lastUsedAcc||C().accounts[0].id,toId=m.toAccountId||null,catId=m.catId||null;
  const amt=$('#mfAmt',s);setTimeout(()=>amt.focus(),120);
  const upd=()=>{$('#mfCur',s).textContent=SYM[acc(accId)?.cur||'PEN'];if(t==='transfer'){const a=acc(accId),b=acc(toId);const w=$('#mfToAmtW',s);if(a&&b&&a.cur!==b.cur){w.classList.remove('hidden');if(!$('#mfToAmt',s).value)$('#mfToAmt',s).value=r2(conv(num(amt.value),a.cur,b.cur))||''}else w.classList.add('hidden')}};
  $$('#mfAcc [data-accid]',s).forEach(b=>b.onclick=()=>{accId=b.dataset.accid;$$('#mfAcc .selchip',s).forEach(x=>x.classList.toggle('on',x===b));upd()});
  $$('#mfTo [data-accid]',s).forEach(b=>b.onclick=()=>{toId=b.dataset.accid;$$('#mfTo .selchip',s).forEach(x=>x.classList.toggle('on',x===b));$('#mfToAmt',s).value='';upd()});
  $$('#mfCat [data-cat]',s).forEach(b=>b.onclick=()=>{catId=b.dataset.cat;$$('#mfCat .catbtn',s).forEach(x=>x.classList.toggle('on',x===b))});
  $$('[data-day]',s).forEach(b=>b.onclick=()=>$('#mfDate',s).value=addDays(today(),+b.dataset.day));
  amt.addEventListener('input',()=>{if(t==='transfer'&&!$('#mfToAmtW',s).classList.contains('hidden'))$('#mfToAmt',s).value=r2(conv(num(amt.value),acc(accId).cur,acc(toId).cur))});
  upd();
  $('#mfSave',s).onclick=()=>{
    const a=num(amt.value);if(a<=0){toast('Escribe un monto mayor a 0');amt.focus();return}
    const date=$('#mfDate',s).value||today();const note=$('#mfNote',s).value.trim();
    if(t==='transfer'){
      if(!toId||toId===accId){toast('Elige una cuenta destino distinta');return}
      const A1=acc(accId),B1=acc(toId);const toAmount=A1.cur!==B1.cur?num($('#mfToAmt',s).value)||r2(conv(a,A1.cur,B1.cur)):a;
      const body={type:'transfer',amount:r2(a),cur:A1.cur,accountId:accId,toAccountId:toId,toAmount:r2(toAmount),date,note};
      m.id?updateMov(m.id,body):addMov(body);
    }else{
      const onB=$('#mfCat .catbtn.on',s);if(onB)catId=onB.dataset.cat;
      if(!catId){toast('Elige una categoría');return}
      const body={type:t,amount:r2(a),cur:acc(accId).cur,accountId:accId,catId,date,note};
      m.id?updateMov(m.id,body):addMov(body);
      if(m.occId&&S.pay.items[m.occId]){S.pay.items[m.occId].amount=r2(a);Store.save('pay')}
    }
    C().lastUsedAcc=accId;Store.save('config');closeSheet();render();toast(m.id?'Cambios guardados ✓':t==='income'?'Ingreso guardado 💚':t==='transfer'?'Transferencia registrada 🔁':'Gasto guardado ✓');
  };
