/* =========================================================
   CONECTORES: Gmail, Google Calendar y Claude
   ========================================================= */
async function getMcp(){if(typeof claude==='undefined'||!claude.use)return null;try{return await claude.use('mcp')}catch(e){return null}}
function mcpMsg(e,server){
  const c=e&&e.code;
  if(c==='server_not_connected'||c==='selection_required')return `Conecta ${server} en claude.ai → Configuración → Conectores.`;
  if(c==='needs_reauth')return `Vuelve a conectar ${server} en claude.ai → Configuración → Conectores.`;
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return `Necesito tu permiso para usar ${server} desde la app. Ábrela dentro de claude.ai y acepta el aviso.`;
  if(c==='blocked_by_policy')return `Tu organización no permite usar ${server} aquí.`;
  if(c==='server_unavailable'||c==='upstream_error')return `${server} no respondió. Revisa en ${server} si la acción se realizó antes de reintentar.`;
  if(c==='tool_error')return `${server} reportó un error: ${(e.message||'').slice(0,140)}`;
  return `${server} no está disponible en esta vista. Abre la app dentro de claude.ai.`;
}
async function sendEmail(subject,html,text){
  if(!C().email){toast('Agrega tu correo en Ajustes',3500);return false}
  const mcp=await getMcp();if(!mcp){toast('El correo funciona al abrir la app dentro de claude.ai',3500);return false}
  try{await mcp.callTool('Gmail','send_message',{to:[C().email],subject,htmlBody:html,body:text});return true}
  catch(e){toast(mcpMsg(e,'Gmail'),5000);return false}
}
function paymentsEmail(){
  const t=today();const P=pendingOut(addDays(t,Math.max(7,C().alerts.daysBefore||3)));
  const lines=P.map(o=>`${o.src.emoji} ${o.src.name}: ${moneyT(o.amount,o.cur)} · ${o.date<t?'VENCIDO ('+fmtDate(o.date)+')':'vence '+fmtDate(o.date)}`);
  const T=totals();
  return {n:P.length,subject:P.length?`🔔 Tienes ${P.length} pago(s) próximo(s)`:'🌿 Sin pagos pendientes esta semana',
    text:(lines.length?lines.join('\n'):'No tienes pagos en los próximos días.')+`\n\nDinero libre: ${moneyT(T.free)}\nRecuerda: el dinero se descuenta solo cuando marcas “Pagado” en la app.`,
    html:`<div style="font-family:Arial,sans-serif;color:#2B1608;max-width:520px"><h2 style="color:#690507">🔔 Pagos próximos</h2>${lines.length?'<ul>'+lines.map(l=>'<li style="margin:6px 0">'+esc(l)+'</li>').join('')+'</ul>':'<p>No tienes pagos en los próximos días. 🌿</p>'}<p>💸 Dinero libre: <b>${moneyT(T.free)}</b></p><p style="color:#7D6B5B;font-size:12px">Marca cada pago como “Pagado” en tu app Mis Finanzas para descontarlo.</p></div>`};
}
async function sendPaymentsEmail(manual){
  const e=paymentsEmail();if(!manual&&!e.n)return;
  const ok=await sendEmail(e.subject,e.html,e.text);
  if(ok){C().alerts.lastEmail=today();Store.save('config');if(manual)toast('Correo enviado a '+C().email+' 📧')}
}
async function calendarSync(){
  const F=C().fixed.filter(f=>f.active);if(!F.length)return toast('No hay gastos fijos activos');
  const mcp=await getMcp();if(!mcp)return toast('Google Calendar funciona al abrir la app dentro de claude.ai',3500);
  const pend=F.filter(f=>!C().alerts.cal[f.id]||C().alerts.cal[f.id]!==f.amount+'|'+f.day+'|'+f.weekday+'|'+f.freq);
  if(!pend.length)return toast('Tus recordatorios ya están en Google Calendar ✓');
  openSheet(sheetHead('📆 Google Calendar')+`<p class="small">Crearé ${pend.length} evento(s) recurrente(s) de día completo con aviso por correo 1 día antes:</p><ul class="small">${pend.map(f=>`<li>${f.emoji} ${esc(f.name)} · ${f.freq==='weekly'?'cada '+DIAS[f.weekday]:'día '+f.day}</li>`).join('')}</ul><p class="tiny muted">Si cambias un gasto fijo, vuelve a sincronizar y borra el evento antiguo en Calendar.</p><div class="btns"><button class="btn block" id="calOk">Crear eventos</button></div><div id="calOut" class="small" style="margin-top:10px"></div>`,s=>{
    $('#calOk',s).onclick=async()=>{$('#calOk',s).disabled=true;let ok=0;
      for(const f of pend){
        const next=occs(today(),addDays(today(),62)).find(o=>o.src.id===f.id);const d=next?next.date:today();
        const rr=f.freq==='weekly'?'RRULE:FREQ=WEEKLY;BYDAY='+['SU','MO','TU','WE','TH','FR','SA'][f.weekday||0]:'RRULE:FREQ=MONTHLY;BYMONTHDAY='+(f.day>28?-1:f.day);
        try{await mcp.callTool('Google Calendar','create_event',{summary:`${f.emoji} Pagar ${f.name} · ${moneyT(f.amount,f.cur)}`,description:'Recordatorio de tu app Mis Finanzas. Marca el pago como “Pagado” en la app para descontarlo.',allDay:true,startTime:d+'T00:00:00',endTime:addDays(d,1)+'T00:00:00',recurrenceData:[rr],overrideReminders:[{method:'email',minutes:1440},{method:'popup',minutes:600}],availability:'AVAILABILITY_FREE',visibility:'private'});
          C().alerts.cal[f.id]=f.amount+'|'+f.day+'|'+f.weekday+'|'+f.freq;ok++;$('#calOut',s).innerHTML+=`✓ ${esc(f.name)}<br>`}
        catch(e){$('#calOut',s).innerHTML+=`✗ ${esc(f.name)}: ${esc(mcpMsg(e,'Google Calendar'))}<br>`;if(['server_not_connected','needs_reauth','not_in_manifest','approval_required'].includes(e&&e.code))break}
      }
      Store.save('config');if(ok)toast(ok+' recordatorio(s) creados 📆');};
  });
}
function claudeContext(){
  const cm=ym(today());const ms=[0,1,2].map(i=>addMonths(cm,-i));const T=totals();const A=allocate();
  return {fecha:today(),moneda:'PEN',tipo_cambio:C().fx,
    meses:ms.map(m=>{const s=monthStats(m);return {mes:m,ingresos:r2(s.inc),gastos:r2(s.exp),por_categoria:Object.fromEntries(Object.entries(s.byCat).map(([k,v])=>[ecat(k).name,r2(v)]))}}),
    presupuestos:Object.fromEntries(C().expCats.filter(c=>c.budget>0).map(c=>[c.name,c.budget])),
    totales:{en_cuentas:r2(T.cash),en_bolsillos:r2(T.pockets),pagos_pendientes:r2(T.committed),libre:r2(T.free),inversiones:r2(T.inv),patrimonio:r2(T.net)},
    ingresos_recurrentes:C().incomes.filter(i=>i.active).map(i=>({nombre:i.name,monto:i.amount,moneda:i.cur,desde:i.from,hasta:i.to})),
    gastos_fijos:C().fixed.filter(f=>f.active).map(f=>({nombre:f.name,monto:f.amount,frecuencia:f.freq})),
    capacidad_ahorro_mensual:r2(A.cap.pool),
    metas:A.goals.map(g=>({meta:g.p.name,prioridad:g.p.priority,objetivo:g.target,moneda:g.p.cur,ahorrado:g.saved,aporte_sugerido:r2(g.recCur),fecha:g.p.due||null}))};
}
async function askClaude(q){
  q=(q||'').trim();if(!q)return toast('Escribe tu pregunta');
  const out=$('#askOut');out.classList.remove('hidden');out.textContent='Pensando…';
  let sample=null;try{sample=typeof claude!=='undefined'&&claude.use?await claude.use('sample'):null}catch(e){}
  if(!sample){out.textContent='El asistente con Claude funciona al abrir la app dentro de claude.ai. Mientras tanto, revisa el análisis automático de arriba.';return}
  const prompt=`Eres un planificador financiero educativo para una joven de 20 años en Lima, Perú (estudiante universitaria, fundadora de una ONG). Responde en español, cálido y directo, en máximo 180 palabras, sin markdown pesado (puedes usar viñetas simples y emojis con moderación).
Reglas: explica el porqué de cada sugerencia con sus números; no recomiendes comprar ni vender activos específicos; si das precios estimados de productos en Perú, dalos como rango aproximado y aclara que debe verificarlos; no inventes datos que no estén en el resumen; si falta información, dilo.
Resumen de sus finanzas (JSON):
${JSON.stringify(claudeContext())}
Pregunta: ${q}`;
  try{const r=await sample(prompt,{modelTier:'default',onText:({text})=>{out.textContent=text}});out.textContent=r.text}
  catch(e){out.textContent=e&&e.code==='not_granted'?'El asistente no tiene permiso en esta vista.':e&&e.code==='rate_limited'?'Demasiadas preguntas seguidas. Intenta en un momento.':'No pude obtener respuesta ahora. Intenta de nuevo.'}
}

/* =========================================================
   SEGURIDAD: PIN y bloqueo
   ========================================================= */
async function hashPin(pin,salt){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},key,256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}
function padHTML(){return `<div class="dots" id="dots">${'<i></i>'.repeat(6)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div>`}
function runPad(root,len,onDone){
  let v='';const dots=$('#dots',root);dots.innerHTML='<i></i>'.repeat(len);
  const draw=()=>$$('i',dots).forEach((d,i)=>d.classList.toggle('f',i<v.length));
  const press=k=>{if(!dots.isConnected)return;if(k==='⌫')v=v.slice(0,-1);else if(v.length<len)v+=k;draw();if(v.length===len){const val=v;setTimeout(()=>{v='';draw();onDone(val)},140)}};
  $$('.pad button',root).forEach(b=>b.onclick=()=>press(b.dataset.k));
  const kh=e=>{if(!dots.isConnected||root.classList.contains('hidden')){document.removeEventListener('keydown',kh);return}if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫')};
  document.addEventListener('keydown',kh);
}
function showLock(){
  UI.unlocked=false;closeSheet();const L=$('#lock');L.classList.remove('hidden');$('#app').classList.add('hidden');
  L.innerHTML=`<div class="brand">Mis <b>Finanzas</b></div><p style="opacity:.8;margin:6px 0 0">Ingresa tu PIN</p>${padHTML()}<p id="lkMsg" class="small" style="opacity:.8;min-height:20px"></p>`;
  let tries=0;
  runPad(L,C().pin.len||4,async v=>{
    let h;try{h=await hashPin(v,C().pin.salt)}catch(e){h=null}
    if(h===C().pin.hash){unlock()}else{tries++;$('#dots',L).classList.add('shake');setTimeout(()=>$('#dots',L)&&$('#dots',L).classList.remove('shake'),400);$('#lkMsg',L).textContent=tries>=5?'Demasiados intentos. Espera 30 segundos.':'PIN incorrecto';if(tries>=5){$$('.pad button',L).forEach(b=>b.disabled=true);setTimeout(()=>{$$('.pad button',L).forEach(b=>b.disabled=false);tries=0;$('#lkMsg',L).textContent=''},30000)}}
  });
}
function unlock(){UI.unlocked=true;UI.lastActive=Date.now();$('#lock').classList.add('hidden');$('#lock').innerHTML='';$('#app').classList.remove('hidden');render();afterUnlock()}
function pinSetup(first){
  const html=`<div style="text-align:center">${sheetHead(first?'Crea tu PIN':'Nuevo PIN')}<p class="small muted">4 dígitos. Lo pediré al abrir la app y tras ${C().lockMin} min de inactividad.</p><div style="background:var(--cocoa);border-radius:20px;padding:16px;display:inline-block">${padHTML()}</div><p id="psMsg" class="small"></p></div>`;
  openSheet(html,s=>{
    let firstV=null;
    runPad(s,4,async v=>{
      if(!firstV){firstV=v;$('#psMsg',s).textContent='Repite tu PIN'}
      else if(firstV!==v){firstV=null;$('#psMsg',s).textContent='No coinciden. Intenta de nuevo.'}
      else{try{const salt=uid()+uid();C().pin={salt,hash:await hashPin(v,salt),len:4};Store.save('config');closeSheet();toast('PIN guardado 🔐');render()}catch(e){toast('Este navegador no permite crear el PIN')}}
    });
  });
}
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{UI.lastActive=Date.now()},{passive:true}));
setInterval(()=>{if(UI.unlocked&&C()&&C().pin&&Date.now()-UI.lastActive>C().lockMin*60000)showLock()},15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)UI.hiddenAt=Date.now();else if(UI.unlocked&&C()&&C().pin&&UI.hiddenAt&&Date.now()-UI.hiddenAt>C().lockMin*60000)showLock()});

/* =========================================================
   BIENVENIDA (primera vez)
   ========================================================= */
function onboarding(){
  const L=$('#lock');L.classList.remove('hidden');
  const me=Store.me||{};
  L.innerHTML=`<div id="onb"><div style="font-size:34px">✨</div><h1 style="font-size:24px;margin:6px 0">Tu app de finanzas</h1>
  <p class="small muted">Empiezo vacía: sin saldos ni movimientos inventados. Ya dejé listas tus cuentas, categorías, gastos fijos y metas para que solo registres tus datos reales.</p>
  <label class="f">¿Cómo te llamo?</label><input class="inp" id="obN" value="${esc(me.name?String(me.name).split(' ')[0]:'Valeria')}">
  <label class="f">Correo para recordatorios</label><input class="inp" id="obE" type="email" value="${esc(me.email||'')}" placeholder="tu@correo.com">
  ${Store.mode==='db'?'<div class="banner info" style="margin-top:12px"><span>☁️</span><div class="small">Tus datos se guardarán en una base de datos privada de tu cuenta: los verás igual en tu celular y tu laptop.</div></div>':`<div class="banner warn" style="margin-top:12px"><span>💾</span><div class="small"><b>Esta copia guarda los datos solo en este dispositivo.</b> Tus saldos y metas están en tu app sincronizada de Claude: <a href="${CLOUD_URL}" target="_blank" rel="noopener">ábrela aquí</a> (y agrégala a tu pantalla de inicio). Si prefieres usar esta copia, importa un respaldo.</div></div><div class="btns" style="margin-top:8px"><button class="btn ghost block" id="obImp">📥 Importar respaldo</button></div>`}
  <div class="btns" style="margin-top:14px"><button class="btn wine block" id="obOk">Empezar y crear mi PIN 🔐</button></div>
  <div class="btns" style="margin-top:8px"><button class="btn ghost block" id="obSkip">Empezar sin PIN</button></div></div>`;
  const start=withPin=>{
    S.config=defaultConfig($('#obN').value.trim()||'Valeria',$('#obE').value.trim());
    // estimaciones iniciales de vivienda y auto (con fuente y fecha); fondo de emergencia e independencia esperan tus datos reales
    for(const k of ['home','car']){const p=S.config.pockets.find(x=>x.kind===k);const e=goalEstimate(p);if(e){p.target=e.value;p.cur=e.cur;p.est=e}}
    Store.save('config','pay','inv');
    UI.unlocked=true;L.classList.add('hidden');$('#app').classList.remove('hidden');chartDefaults();UI.view='cuentas';render();
    if(withPin)setTimeout(()=>pinSetup(true),300);
  };
  $('#obOk').onclick=()=>start(true);$('#obSkip').onclick=()=>start(false);
  const oi=$('#obImp');if(oi)oi.onclick=()=>{S.config=defaultConfig('Valeria','');UI.unlocked=true;L.classList.add('hidden');$('#app').classList.remove('hidden');chartDefaults();render();ACT.importData()};
}

/* =========================================================
   ARRANQUE
   ========================================================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){if(t.tagName==='A')e.preventDefault();f(t,e)}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&VIEWS[h]&&h!==UI.view&&UI.unlocked){UI.view=h;render()}});
function afterUnlock(){
  const a=C().alerts;
  if(a.emailAuto&&a.lastEmail!==today()&&pendingOut(addDays(today(),a.daysBefore||3)).length)setTimeout(()=>sendPaymentsEmail(false),1500);
}
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
(async function boot(){
  await Store.init();
  if(Store.mode==='error'){
    const L=$('#lock');L.classList.remove('hidden');
    L.innerHTML=`<div class="brand">Mis <b>Finanzas</b></div><p style="opacity:.85;max-width:320px">No pude conectarme con tus datos guardados. Revisa tu conexión a internet y vuelve a intentarlo. Tus datos están a salvo.</p><button class="btn pist" id="rt" style="margin-top:12px">Reintentar</button>`;
    $('#rt').onclick=()=>location.reload();return;
  }
  const h=location.hash.slice(1);if(h&&VIEWS[h])UI.view=h;
  if(!S.config){onboarding();return}
  // migraciones suaves
  const c=S.config;c.plan=c.plan||defaultConfig().plan;c.alerts=Object.assign({emailAuto:false,lastEmail:'',cal:{},daysBefore:3},c.alerts||{});c.otherAssets=c.otherAssets||[];c.debts=c.debts||[];
  chartDefaults();
  if(c.pin)showLock();else{UI.unlocked=true;$('#lock').classList.add('hidden');$('#app').classList.remove('hidden');render();afterUnlock()}
})();
</script>
